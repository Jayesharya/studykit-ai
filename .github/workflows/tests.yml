name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "Flask>=3.0,<4"
      - name: Compile application
        run: python -m compileall -q app.py classroom_agent tests
      - name: Run API checks
        run: python -m unittest discover -s tests -v
